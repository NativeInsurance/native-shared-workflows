name: Security Audit

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12'
      bandit-target:
        required: false
        type: string
        default: src/
      bandit-config:
        required: false
        type: string
        default: bandit.yaml
      semgrep-rules:
        required: false
        type: string
        default: '.semgrep/'
      semgrep-severity:
        required: false
        type: string
        default: 'ERROR'
      images:
        required: false
        type: string
        default: '[]'
        description: 'JSON array: [{"dockerfile":"Dockerfile.prod","name":"backend"}, ...]'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Run TruffleHog secret scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/trufflesecurity/trufflehog@sha256:56c25710275c4b8d74c4f1346a5e7c606fa7ff4afe996f680b288d0fae3fcd9c \
            filesystem . \
            --results=verified \
            --fail \
            --no-update \
            --github-actions

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.8.3 semgrep==1.136.0 'setuptools<81'
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run Bandit SAST
        run: bandit -r ${{ inputs.bandit-target }} -c ${{ inputs.bandit-config }} --severity-level medium --confidence-level medium

      - name: Run Semgrep
        if: inputs.semgrep-rules != ''
        run: semgrep --config ${{ inputs.semgrep-rules }} --severity ${{ inputs.semgrep-severity }} --quiet --no-secrets-validation

      - name: Build and scan images
        if: inputs.images != '[]'
        run: |
          echo '${{ inputs.images }}' | python3 -c "
          import json, sys, os, subprocess

          images = json.load(sys.stdin)
          for img in images:
              print(f'Building {img[\"name\"]} from {img[\"dockerfile\"]}')
              subprocess.run(['docker', 'build', '-t', f'{img[\"name\"]}:scan', '-f', img['dockerfile'], '.'], check=True)
              print(f'Running Trivy on {img[\"name\"]}')
              subprocess.run([
                  'docker', 'run', '--rm',
                  '-v', '/var/run/docker.sock:/var/run/docker.sock',
                  'aquasec/trivy:latest',
                  'image', '--format', 'table',
                  '--severity', 'CRITICAL,HIGH',
                  '--ignore-unfixed',
                  '--exit-code', '0',
                  f'{img[\"name\"]}:scan',
              ], check=False)
              sbom_path = f'sbom-{img[\"name\"]}-spdx.json'
              subprocess.run([
                  'docker', 'run', '--rm',
                  '-v', f'{os.getcwd()}:/work', '-w', '/work',
                  'anchore/syft:latest',
                  f'{img[\"name\"]}:scan',
                  '-o', f'spdx-json={sbom_path}',
              ], check=True)
          "

      - name: Upload SBOM artifacts
        if: inputs.images != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sboms
          path: sbom-*.json
